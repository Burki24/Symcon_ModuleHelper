name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Validate JSON configuration
        run: |
          python3 -m json.tool manifest.json > /dev/null
          python3 -m json.tool .github/helper-consumers.json > /dev/null

      - name: Validate helper translations
        run: python3 .github/scripts/update_helper_translations.py

      - name: Python syntax
        run: python3 -m py_compile .github/scripts/*.py

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate helper manifest
        run: python3 .github/scripts/verify_manifest.py

      - name: Run tests
        run: php tests/run.php
