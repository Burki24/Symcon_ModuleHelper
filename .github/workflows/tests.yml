name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: PHP lint
        shell: bash
        run: |
          set -euo pipefail
          find src tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php tests/run.php
