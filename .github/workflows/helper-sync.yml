name: Sync Helpers to Consumers

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'manifest.json'
      - '.github/helper-consumers.json'
      - '.github/scripts/sync_helper_consumers.py'
      - '.github/workflows/helper-sync.yml'
  workflow_dispatch:
    inputs:
      helper:
        description: 'Helper name to synchronize, or all'
        required: true
        default: 'all'
        type: string

permissions:
  contents: read

jobs:
  sync:
    if: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'CHORE: Update helper metadata') }}"
    runs-on: ubuntu-latest
    env:
      APP_CLIENT_ID: ${{ vars.HELPER_SYNC_APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.HELPER_SYNC_APP_PRIVATE_KEY }}

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve synchronized source range
        id: source
        shell: bash
        run: |
          set -euo pipefail

          source_sha=$(git rev-parse HEAD)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            base_ref="${{ github.event.before }}"
          else
            base_ref=$(
              git show -s --format=%B "$source_sha" \
                | sed -n 's/^Source-Before: //p' \
                | tail -n1
            )
            if [[ -z "$base_ref" ]] || ! git cat-file -e "${base_ref}^{commit}" 2>/dev/null; then
              base_ref=$(git rev-parse "${source_sha}^^" 2>/dev/null || git rev-parse "${source_sha}^")
            fi
          fi

          echo "base_ref=$base_ref" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Check sync configuration
        id: config
        shell: bash
        run: |
          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Helper sync is not configured yet; skipping cross-repository updates."
          fi

      - name: Resolve consumer repositories
        if: steps.config.outputs.enabled == 'true'
        id: consumers
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          owner = os.environ["REPOSITORY_OWNER"]
          prefix = f"{owner}/"
          data = json.loads(Path(".github/helper-consumers.json").read_text(encoding="utf-8"))
          repositories = []
          for consumer in data.get("consumers", []):
              repository = str(consumer.get("repository", ""))
              if not repository.startswith(prefix):
                  raise SystemExit(f"Consumer repository must belong to {owner}: {repository}")
              repositories.append(repository[len(prefix):])
          if not repositories:
              raise SystemExit("No consumer repositories configured.")
          print("repositories<<EOF")
          print("\n".join(repositories))
          print("EOF")
          PY

      - name: Create GitHub App token
        if: steps.config.outputs.enabled == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ env.APP_CLIENT_ID }}
          private-key: ${{ env.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.consumers.outputs.repositories }}

      - name: Validate helper manifest
        run: python3 .github/scripts/verify_manifest.py

      - name: Validate helper translations
        run: python3 .github/scripts/update_helper_translations.py

      - name: Synchronize subscribed helpers
        if: steps.config.outputs.enabled == 'true'
        env:
          HELPER_SYNC_TOKEN: ${{ steps.app-token.outputs.token }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ steps.source.outputs.base_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          REQUESTED_HELPER: ${{ inputs.helper || 'all' }}
        run: python3 .github/scripts/sync_helper_consumers.py
